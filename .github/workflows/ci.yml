name: chave-ms-auth ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chave
          POSTGRES_PASSWORD: chave_secret
          POSTGRES_DB: chave_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chave -d chave_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://chave:chave_secret@localhost:5432/chave_auth_test?schema=public
      TEST_DATABASE_URL: postgresql://chave:chave_secret@localhost:5432/chave_auth_test?schema=public
      JWT_SECRET: ci-secret-with-at-least-thirty-two-characters
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      PASSWORD_RESET_TOKEN_TTL: 30m
      REFRESH_COOKIE_NAME: chave_refresh
      REFRESH_COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:4001
      FRONTEND_RESET_PASSWORD_URL: http://localhost:4001/reset-password
      SEED_ADMIN_EMAIL: admin@chave.local
      SEED_ADMIN_PASSWORD: Admin123!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t chave-ms-auth:${{ github.sha }} .
      - run: tar -czf chave-ms-auth-dist.tar.gz dist prisma package.json package-lock.json Dockerfile docker-entrypoint.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chave-ms-auth-dist
          path: chave-ms-auth-dist.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: chave-ms-auth-dist.tar.gz
